slug: docker-basics
title: "Docker và Compose cơ bản"
summary: "Từ con số 0 tới chạy một ứng dụng nhiều service: hiểu image và container thật ra là gì, tự viết Dockerfile, làm image nhỏ và an toàn, giữ dữ liệu bằng volume, chạy cả hệ thống bằng Docker Compose, rồi đưa image lên GHCR. Không cần biết GitHub Actions. Muốn đi trọn một dự án từ GitHub Actions tới Docker thì học track gộp \"GitHub Actions và Docker\" (actions-docker); chỉ cần Docker thì học track này."
language: vi
level: beginner
estimatedHours: 15
tags: [docker, docker-compose, container, devops, ghcr]
outcomes:
  - "Giải thích được image, container, layer, volume và network là gì, và container khác máy ảo ở đâu"
  - "Chạy, xem log, vào trong và dọn dẹp container; viết Dockerfile đóng gói một trang web tĩnh"
  - "Làm image nhỏ và an toàn hơn bằng multi-stage build, .dockerignore và user không phải root"
  - "Dùng Docker Compose chạy trang web cùng Umami và Postgres, có .env và healthcheck, và tự gỡ các lỗi hay gặp"
  - "Gắn tag phiên bản và đưa image lên GitHub Container Registry để máy khác kéo về chạy"
maintainers: [github:TienNHM]
